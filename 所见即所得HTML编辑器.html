<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>所见即所得HTML编辑器</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        .code-toolbar {
            position: relative;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .code-header {
            background: #f5f5f5;
            padding: 5px 10px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .code-language {
            font-family: monospace;
            font-size: 0.9em;
            color: #666;
        }
        .delete-code {
            cursor: pointer;
            color: #dc3545;
            font-size: 0.8em;
        }
        #editor {
            min-height: 400px;
            border: 1px solid #ccc;
            padding: 15px;
            margin-top: 10px;
            background: white;
        }
    </style>
</head>
<body>
    <div class="container mt-3">
        <div class="btn-toolbar" role="toolbar">
            <!-- 字体大小 -->
            <select class="form-select me-2" id="fontSize">
                <option value="p">正文</option>
                <option value="h1">标题1</option>
                <option value="h2">标题2</option>
                <option value="h3">标题3</option>
                <option value="h4">标题4</option>
                <option value="h5">标题5</option>
                <option value="h6">标题6</option>
            </select>

            <!-- 字体颜色 -->
            <select class="form-select me-2" id="fontColor">
                <option value="black">字体颜色</option>
                <option style="color: aqua" value="#00ffff">水蓝色</option>
                <option style="color: black" value="#000000">黑色</option>
                <option style="color: blue" value="#0000ff">蓝色</option>
                <option style="color: fuchsia" value="#ff00ff">紫红色</option>
                <option style="color: gray" value="#808080">灰色</option>
                <option style="color: green" value="#008000">绿色</option>
                <option style="color: lime" value="#00ff00">亮绿色</option>
                <option style="color: maroon" value="#800000">栗色</option>
                <option style="color: navy" value="#000080">藏青色</option>
                <option style="color: olive" value="#808000">橄榄色</option>
                <option style="color: purple" value="#800080">紫色</option>
                <option style="color: red" value="#ff0000">红色</option>
                <option style="color: silver" value="#c0c0c0">银色</option>
                <option style="color: teal" value="#008080">青色</option>
                <option style="color: white" value="#ffffff">白色</option>
                <option style="color: yellow" value="#ffff00">黄色</option>
                <option style="color: orange" value="#ffa500">橙色</option>
            </select>

            <!-- 背景颜色 -->
            <select class="form-select me-2" id="bgColor">
                <option value="#ffffff">背景颜色</option>
                <option style="background: #00ffff" value="#00ffff">水蓝色</option>
                <option style="background: #000000; color: white" value="#000000">黑色</option>
                <option style="background: #0000ff; color: white" value="#0000ff">蓝色</option>
                <option style="background: #ff00ff" value="#ff00ff">紫红色</option>
                <option style="background: #808080" value="#808080">灰色</option>
                <option style="background: #008000" value="#008000">绿色</option>
                <option style="background: #00ff00" value="#00ff00">亮绿色</option>
                <option style="background: #800000; color: white" value="#800000">栗色</option>
                <option style="background: #000080; color: white" value="#000080">藏青色</option>
                <option style="background: #808000" value="#808000">橄榄色</option>
                <option style="background: #800080" value="#800080">紫色</option>
                <option style="background: #ff0000" value="#ff0000">红色</option>
                <option style="background: #c0c0c0" value="#c0c0c0">银色</option>
                <option style="background: #008080" value="#008080">青色</option>
                <option style="background: #ffffff" value="#ffffff">白色</option>
                <option style="background: #ffff00" value="#ffff00">黄色</option>
                <option style="background: #ffa500" value="#ffa500">橙色</option>
            </select>

            <button class="btn btn-outline-primary me-2" onclick="formatText('bold')"><strong>B</strong></button>
            <button class="btn btn-outline-primary me-2" onclick="formatText('italic')"><em>I</em></button>
            <button class="btn btn-outline-primary me-2" onclick="formatText('underline')"><u>U</u></button>
            
            <button class="btn btn-outline-success me-2" onclick="insertLink()">链接</button>
            <button class="btn btn-outline-success me-2" onclick="insertCodeBlock()">代码块</button>
            <button class="btn btn-outline-success me-2" onclick="insertTable()">表格</button>
            <button class="btn btn-outline-success me-2" onclick="insertImage()">图片</button>
            
            <button class="btn btn-primary" onclick="downloadHtml()">下载HTML</button>
        </div>

        <div id="editor" contenteditable="true"></div>
    </div>

    <script>
        function formatText(command) {
            document.execCommand(command, false, null);
        }

        // 修改字体大小处理逻辑
        document.getElementById('fontSize').addEventListener('change', function(e) {
            document.execCommand('formatBlock', false, e.target.value);
        });

        // 修正背景颜色功能
        document.getElementById('bgColor').addEventListener('change', function(e) {
            document.execCommand('styleWithCSS', true, null);
            document.execCommand('backColor', false, e.target.value);
        });

        document.getElementById('fontColor').addEventListener('change', function(e) {
            document.execCommand('foreColor', false, e.target.value);
        });

        // 保持其他函数不变...
        function insertLink() {
            const url = prompt('请输入链接地址：');
            url && document.execCommand('createLink', false, url);
        }

        function insertCodeBlock() {
            const modal = document.createElement('div');
            modal.style.position = 'fixed';
            modal.style.top = '0';
            modal.style.left = '0';
            modal.style.width = '100%';
            modal.style.height = '100%';
            modal.style.backgroundColor = 'rgba(0,0,0,0.5)';
            modal.style.display = 'flex';
            modal.style.justifyContent = 'center';
            modal.style.alignItems = 'center';
            modal.style.zIndex = '1000';

            const dialog = document.createElement('div');
            dialog.style.background = 'white';
            dialog.style.padding = '20px';
            dialog.style.borderRadius = '5px';
            dialog.style.width = '500px';

            const langSelect = document.createElement('select');
            langSelect.className = 'form-select mb-3';
            langSelect.innerHTML = `
                <option value="plaintext">纯文本</option>
                <option value="html">HTML</option>
                <option value="javascript">JavaScript</option>
                <option value="css">CSS</option>
                <option value="python">Python</option>
                <option value="java">Java</option>
                <option value="php">PHP</option>
            `;

            const codeTextarea = document.createElement('textarea');
            codeTextarea.className = 'form-control mb-3';
            codeTextarea.style.height = '200px';
            codeTextarea.placeholder = '输入代码内容...';

            const insertBtn = document.createElement('button');
            insertBtn.className = 'btn btn-primary me-2';
            insertBtn.textContent = '插入';
            insertBtn.onclick = () => {
                const code = codeTextarea.value.trim();
                const language = langSelect.value;
                if (code) {
                    const codeBlock = `
                        <div class="code-toolbar">
                            <div class="code-header">
                                <span class="code-language">${language}</span>
                                <span class="delete-code" onclick="this.parentElement.parentElement.remove()">删除</span>
                            </div>
                            <pre><code class="language-${language}">${hljs.highlightAuto(code).value}</code></pre>
                        </div>
                    `;
                    document.execCommand('insertHTML', false, codeBlock);
                    hljs.highlightAll();
                    modal.remove();
                }
            };

            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'btn btn-outline-secondary';
            cancelBtn.textContent = '取消';
            cancelBtn.onclick = () => modal.remove();

            dialog.appendChild(langSelect);
            dialog.appendChild(codeTextarea);
            dialog.appendChild(insertBtn);
            dialog.appendChild(cancelBtn);
            modal.appendChild(dialog);
            document.body.appendChild(modal);
        }

        function insertTable() {
            const cols = parseInt(prompt('输入列数：')) || 1;
            const rows = parseInt(prompt('输入行数：')) || 1;
            let tableHtml = '<table class="table table-bordered">';
            for (let i = 0; i < rows; i++) {
                tableHtml += '<tr>';
                for (let j = 0; j < cols; j++) {
                    tableHtml += `<td>${String.fromCharCode(65+j)}${i+1}</td>`;
                }
                tableHtml += '</tr>';
            }
            document.execCommand('insertHTML', false, tableHtml + '</table>');
        }

        function insertImage() {
            const url = prompt('输入图片URL：');
            url && document.execCommand('insertImage', false, url);
        }

        function downloadHtml() {
            const content = `<!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
                    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css">
                    <style>
                        ${document.querySelector('style').innerHTML}
                    </style>
                </head>
                <body>
                    ${document.getElementById('editor').innerHTML}
                    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"><\/script>
                    <script>hljs.highlightAll();<\/script>
                </body>
                </html>`;
            
            const blob = new Blob([content], {type: 'text/html'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'editor-content.html';
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
